name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0


      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.8.1
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-nx-agents


      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # Required by the terraform (format, init) and checkov (uvx) Nx targets
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@v10.2.0

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5


      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx record -- echo Hello World
      - run: pnpm exec nx affected -t lint test build typecheck
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()

      # Disabled: redundant with the "nx affected" step above, and fails with "nx: command not found" (missing "pnpm exec")
      # - run: nx affected -t lint test build
      # Include the task you ran locally, to make sure we get our cache hit. You can remove this later.
      #- run: nx build my- app

[tool.coverage.run]
branch = true
source = [ "stardew_valley_db" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/db/html'
 --cov-report xml:'../../coverage/packages/db/coverage.xml'
 --html='../../reports/packages/db/unittests/html/index.html'
 --junitxml='../../reports/packages/db/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "stardew_valley_db" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "stardew-valley-helper-stardew-valley-db"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "pynamodb==6.1.0",
  "boto3==1.43.103",
  "aws-lambda-powertools==3.35.0",
  "python-ulid>=4.1.0",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.5",
]

[tool.ty.src]
# Dataset build script copied verbatim from aws-danhenrique; not part of the package
exclude = [ "scripts" ]

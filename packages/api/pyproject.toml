[tool.coverage.run]
branch = true
source = [ "stardew_valley_api" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/api/html'
 --cov-report xml:'../../coverage/packages/api/coverage.xml'
 --html='../../reports/packages/api/unittests/html/index.html'
 --junitxml='../../reports/packages/api/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "stardew_valley_api" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources.stardew-valley-helper-stardew-valley-db]
workspace = true

[project]
name = "stardew-valley-helper-stardew-valley-api"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "aws-lambda-powertools==3.35.0",
  "aws-lambda-powertools[tracer]==3.35.0",
  "stardew-valley-helper-stardew-valley-db"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
 "fastapi[standard]==0.141.1",
 "httpx>=0.28.1",
 "moto[dynamodb]>=5.2.5",
]

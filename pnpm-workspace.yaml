# Security fixes for transitive dependencies that nx@23.2.1 and @aws/nx-plugin@1.0.4 pin to exact,
# vulnerable versions. Same major only. Remove each entry once the parent ships the fix
# (nx 24 / @aws/nx-plugin 1.8 already do for most of them).
overrides:
  vite: 8.3.8
  vitest: 4.1.12
  axios: 1.21.1
  smol-toml: 1.9.1
  follow-redirects: 1.16.3
  brace-expansion@>=5.0.0 <5.0.12: 5.1.0

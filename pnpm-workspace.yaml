autoInstallPeers: true
allowBuilds:
  nx: true
  '@swc/core': true
  esbuild: true
  sharp: true
packages:
  - packages/*
  - packages/common/*
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - nx
  - sharp
catalogMode: strict
catalog:

  '@types/node': 26.6.6
  vite: 8.3.8
  vitest: 5.1.1
  '@vitest/coverage-v8': 5.1.1
  jsdom: 29.1.1
  '@nx/vitest': 24.0.6
  react: 19.3.1
  react-dom: 19.3.1
  class-variance-authority: 0.7.1
  cn: 0.5.2
  lucide-react: 1.77.0
  tw-animate-css: 1.4.0
  radix-ui: 1.8.1
  '@nx-extend/terraform': 10.4.1
